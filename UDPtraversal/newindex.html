<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC TURN Only</title>
</head>
<body>
    <h2>WebRTC (TURN Only)</h2>
    <video id="localVideo" autoplay playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <button onclick="startCall()">Start Call</button>
    
    <script>
        const ws = new WebSocket("ws://localhost:3000");
        let peerConnection;
        let localStream;
        let remoteStream;
        let myId = Math.random().toString(36).substring(7);

        ws.onopen = () => ws.send(JSON.stringify({ type: "register", id: myId }));

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection({
                iceServers: [
                    {
                        urls: "server.bcis-rnd.xyz:3478",
                        username: "guest",
                        credential: "somepassword"
                    }
                ],
                iceTransportPolicy: "relay"  // FORCES TURN ONLY
            });

            peerConnection.ontrack = event => {
                document.getElementById("remoteVideo").srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    ws.send(JSON.stringify({ type: "candidate", to: "peer", candidate: event.candidate }));
                }
            };
        }

        async function startCall() {
            createPeerConnection();
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = localStream;

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            let offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: "offer", to: "peer", offer }));
        }

        ws.onmessage = async (message) => {
            let data = JSON.parse(message.data);
            if (data.type === "offer") {
                createPeerConnection();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                let answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: "answer", to: data.from, answer }));
            } else if (data.type === "answer") {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            } else if (data.type === "candidate") {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };
    </script>
</body>
</html>
